<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Micro ECF</title>
  <desc id="desc">A project gains a persistent ECF contract, an allowed-source map, blocked-source proof, citations, and an optional no-spend Agent OS preview export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081120"/><stop offset="1" stop-color="#16233b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45d6df"/><stop offset="1" stop-color="#ff7453"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 108H1280M0 320H1280M0 532H1280M170 0V640M640 0V640M1110 0V640" stroke="#263550" opacity="0.52"/>
  <rect x="58" y="54" width="7" height="532" rx="3" fill="url(#accent)"/>
  <text x="104" y="122" fill="#45d6df" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750" letter-spacing="2">MICRO ECF</text>
  <text x="104" y="218" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">Give every new agent</text>
  <text x="104" y="290" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">the same inspectable</text>
  <text x="104" y="362" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">project boundary.</text>
  <text x="104" y="428" fill="#b8c5d9" font-family="Inter, Arial, sans-serif" font-size="24">Local policy, provenance, context, and handoff artifacts.</text>
  <text x="104" y="518" fill="#ff9279" font-family="JetBrains Mono, Consolas, monospace" font-size="18">npx agoragentic-micro-ecf@latest init --dir .</text>

  <g transform="translate(724 72)">
    <rect width="492" height="496" rx="28" fill="#0b1527" stroke="#2a3a56" stroke-width="2"/>
    <g transform="translate(30 28)">
      <rect width="432" height="82" rx="16" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <text x="24" y="31" fill="#75edf3" font-family="JetBrains Mono, Consolas, monospace" font-size="13">PERSISTENT CONTRACT</text>
      <text x="24" y="59" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750">ECF.md + AGENTS.md</text>
    </g>
    <path d="M246 112V140" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(30 144)">
      <rect width="204" height="132" rx="16" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <text x="22" y="31" fill="#75edf3" font-family="JetBrains Mono, Consolas, monospace" font-size="13">ALLOWED</text>
      <text x="22" y="61" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">docs / source</text>
      <text x="22" y="88" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">path · hash · citation</text>
    </g>
    <g transform="translate(258 144)">
      <rect width="204" height="132" rx="16" fill="#101d33" stroke="#ff7453" stroke-opacity="0.55"/>
      <text x="22" y="31" fill="#ff9b84" font-family="JetBrains Mono, Consolas, monospace" font-size="13">BLOCKED</text>
      <text x="22" y="61" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">secrets / private</text>
      <text x="22" y="88" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">boundary proof only</text>
    </g>
    <path d="M246 278V306" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(30 310)">
      <rect width="432" height="154" rx="16" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <text x="24" y="31" fill="#75edf3" font-family="JetBrains Mono, Consolas, monospace" font-size="13">LOCAL OUTPUT</text>
      <text x="24" y="60" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">context packet + policy summary</text>
      <text x="24" y="87" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">source map · worklog · handoff · optional MCP</text>
      <text x="24" y="114" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">optional no-spend Agent OS preview export</text>
    </g>
  </g>
</svg>
